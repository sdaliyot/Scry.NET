# Publishes Scry.Net.Contracts/Scry.Net.Client to nuget.org via NuGet Trusted Publishing (OIDC - no stored
# API key; see nuget.org's Trusted Publishing docs) and builds self-contained scry CLI bundles for
# win-x64/win-x86 as GitHub Release assets. Triggered by pushing a `v*` tag, e.g. `v0.1.0`.
#
# One-time setup this workflow depends on (not done by this file):
#   - Register a NuGet Trusted Publishing policy at nuget.org (account -> Trusted Publishing):
#     Repository Owner "sdaliyot", Repository "Scry.NET", Workflow File "release.yml".
#   - main is protected by a ruleset requiring a PR for every change. Role-based bypass entries
#     (e.g. "Repository admin") only apply to interactive/session-authenticated pushes - both a
#     classic and a fine-grained personal access token were tried for the "Sync plugin manifest
#     versions" step below and neither bypassed the rule (confirmed empirically: GH013 rejection
#     either way), which matches GitHub's deliberate design - a leaked repo-secret PAT bypassing
#     required review would defeat the point of the rule. A GitHub App installation token can be
#     added to a ruleset's bypass list as an actual Integration actor, so that step instead needs:
#       - A GitHub App created under your account (Settings -> Developer settings -> GitHub Apps),
#         with repository permission Contents: Read and write, installed on this repo only.
#       - Its App ID in a repo secret RELEASE_APP_ID, and a generated private key's full contents
#         in a repo secret RELEASE_APP_PRIVATE_KEY (Settings -> Secrets and variables -> Actions).
#       - The App added to the ruleset's bypass list for main (Settings -> Rules -> Rulesets ->
#         Bypass list) - it appears there once installed, the same way Copilot's apps do.
#   - See ci.yml's feasibility notes for the same windows-latest/native-toolchain assumptions this
#     workflow shares.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # to create the GitHub Release and upload assets
      id-token: write # to mint a short-lived NuGet API key via Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compute package version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Generate release app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: sdaliyot
          repositories: Scry.NET

      - name: Sync plugin manifest versions
        shell: pwsh
        # .claude-plugin/plugin.json and marketplace.json otherwise stay frozen at whatever version
        # they were typed as originally, unrelated to the tag that actually shipped. Regex-replaces
        # the sole "version" field in each file - correct for today's single-plugin marketplace.json;
        # would need to become entry-scoped if a second plugins[] entry with its own version is ever
        # added. Commits straight to main (not this tag) since that's what the marketplace install
        # path (/plugin marketplace add) reads from. Pushes with the App installation token from the
        # step above rather than the default GITHUB_TOKEN or a PAT - see this workflow's header
        # comment for why: main's ruleset requires a PR for every change, and only an installed
        # GitHub App (added to the ruleset's bypass list) actually bypasses that, not a PAT.
        #
        # A failure here (e.g. the App not granted an actual bypass) stops the whole release -
        # deliberately, so a broken manifest sync can't ship silently alongside a real release.
        # PowerShell does NOT stop or return a non-zero exit code just because a native command like
        # git fails, so every git call below is followed by an explicit $LASTEXITCODE check that
        # throws - otherwise this step would report success (green) even when the push silently
        # failed, which is what happened before this comment was added.
        env:
          GH_PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Checked([string]$Description) {
              if ($LASTEXITCODE -ne 0) { throw "$Description failed with exit code $LASTEXITCODE." }
          }

          $version = "${{ steps.version.outputs.version }}"
          foreach ($path in ".claude-plugin\plugin.json", ".claude-plugin\marketplace.json") {
              $content = Get-Content $path -Raw
              $updated = $content -replace '"version":\s*"[^"]+"', "`"version`": `"$version`""
              if ($updated -ne $content) {
                  Set-Content $path $updated -NoNewline
              }
          }

          git diff --quiet -- .claude-plugin
          if ($LASTEXITCODE -ne 0) {
              # Attributed to the App itself (GitHub's bot-commit convention), not the generic
              # github-actions[bot] identity - it's the App's installation token doing the push.
              git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
              git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
              git remote set-url origin "https://x-access-token:$env:GH_PUSH_TOKEN@github.com/sdaliyot/Scry.NET.git"
              try {
                  git fetch origin main; Invoke-Checked "git fetch"
                  git checkout main; Invoke-Checked "git checkout main"
                  git add .claude-plugin/plugin.json .claude-plugin/marketplace.json
                  git commit -m "Bump plugin manifest version to $version"; Invoke-Checked "git commit"
                  git push origin main; Invoke-Checked "git push"
              } finally {
                  git remote set-url origin https://github.com/sdaliyot/Scry.NET.git
              }
          }

      - name: Build native bootstrap DLL (both architectures)
        shell: pwsh
        run: .\build-native.ps1 -Architecture all -Version ${{ steps.version.outputs.version }}

      - name: dotnet build Scry.sln -c Release
        run: dotnet build Scry.sln -c Release -p:Version=${{ steps.version.outputs.version }} -p:RequireNativeInjector=true --nologo

      - name: Run the full validation matrix
        shell: pwsh
        # -Version must be forwarded: without it, validate.ps1's own dotnet build/test calls
        # rebuild against Directory.Build.props' VersionPrefix default (0.1.0), clobbering the
        # correctly-versioned binaries the previous step just produced before Pack/Publish run.
        run: .\validate.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Pack Scry.Net.Contracts and Scry.Net.Client
        run: |
          dotnet pack src\Scry.Contracts\Scry.Contracts.csproj -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.version }} -o artifacts\packages
          dotnet pack src\Scry.Client\Scry.Client.csproj -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.version }} -o artifacts\packages

      - name: NuGet login (Trusted Publishing -> short-lived API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: sdaliyot

      - name: Push packages to nuget.org
        run: |
          dotnet nuget push "artifacts\packages\Scry.Net.Contracts.*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts\packages\Scry.Net.Client.*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish self-contained CLI (win-x64)
        run: dotnet publish src\Scry.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:RequireNativeInjector=true -p:Version=${{ steps.version.outputs.version }} -o artifacts\scry-win-x64

      - name: Publish self-contained CLI (win-x86)
        run: dotnet publish src\Scry.Cli -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:RequireNativeInjector=true -p:Version=${{ steps.version.outputs.version }} -o artifacts\scry-win-x86

      - name: Bundle release zips
        shell: pwsh
        run: |
          foreach ($arch in "win-x64", "win-x86") {
              $dir = "artifacts\scry-$arch"

              # 1. Remove all PDBs (root and payload)
              Get-ChildItem -Path $dir -Recurse -Filter *.pdb | Remove-Item -Force

              # 2. Remove orphaned runtime config
              Remove-Item "$dir\scry-injector.runtimeconfig.json" -Force -ErrorAction SilentlyContinue

              # 3. Include reference assemblies for test projects (lib/net and lib/netfx)
              New-Item -ItemType Directory -Path "$dir\lib\net", "$dir\lib\netfx" -Force | Out-Null
              Copy-Item "src\Scry.Contracts\bin\Release\net8.0\Scry.Contracts.dll", "src\Scry.Client\bin\Release\net8.0\Scry.Client.dll", "src\Scry.Injector\bin\Release\net8.0\scry-injector.dll" -Destination "$dir\lib\net"
              Copy-Item "src\Scry.Contracts\bin\Release\net462\Scry.Contracts.dll", "src\Scry.Client\bin\Release\net462\Scry.Client.dll", "src\Scry.Injector\bin\Release\net462\scry-injector.dll" -Destination "$dir\lib\netfx"

              Copy-Item README.md, LICENSE -Destination $dir
              Copy-Item skills\scry\SKILL.md -Destination $dir

              # README.md links the logo as "assets/Scry.NET-logo.png" - keep that path valid here too.
              New-Item -ItemType Directory -Path "$dir\assets" -Force | Out-Null
              Copy-Item assets\Scry.NET-logo.png -Destination "$dir\assets"
              Compress-Archive -Path "$dir\*" -DestinationPath "artifacts\scry-$arch.zip"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/scry-win-x64.zip
            artifacts/scry-win-x86.zip
          generate_release_notes: true
          body: |
            Unsigned self-contained binaries - no .NET runtime install required, but Windows
            SmartScreen and antivirus/EDR may warn on first run. Expected for an unsigned executable
            that performs process injection by design; see `docs/threat-model.md`.
